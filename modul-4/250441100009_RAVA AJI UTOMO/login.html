<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page - Online Course Education</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <button id="theme-toggle" class="btn btn-outline-secondary position-absolute top-0 end-0 m-4 border-0 fw-bold"
        style="font-size: 0.9rem; z-index: 10;" title="Toggle Dark Mode">Dark Mode</button>

    <div class="container-fluid login-container">
        <div class="row h-100">
            <div class="col-md-6 login-left d-none d-md-flex">
                <div>
                    <h1 class="fw-bold mb-4" style="font-size: 3rem;">Hello Prospective<br>Students</h1>

                    <div class="text-center my-4">
                        <img src="assets/gambar_login page.png" alt="Education Illustration" class="img-fluid"
                            style="max-height: 300px; border-radius: 10px;">
                    </div>

                    <p class="mt-4" style="font-size: 1.1rem; line-height: 1.6;">
                        Unlock your professional potential. Learn from<br>
                        industry leaders and stay ahead of the<br>
                        competition.
                    </p>
                </div>
            </div>

            <div class="col-md-6 login-right">
                <div class="login-form-box">
                    <h3 class="fw-bold text-dark mb-1">LOGIN PAGE</h3>
                    <p class="text-muted mb-4" style="font-size: 0.9rem;">Masukkan Username dan Password Anda</p>
                    <form id="loginForm" novalidate>
                        <div class="mb-2">
                            <input type="email" class="form-control text-center text-primary" id="emailInput"
                                placeholder="Email Addres">
                            <div class="error-message" id="emailError">Email tidak valid atau kosong.</div>
                        </div>

                        <div class="mb-2">
                            <input type="password" class="form-control text-center text-primary" id="passwordInput"
                                placeholder="Password">
                            <div class="error-message" id="passwordError">Password tidak boleh kosong.</div>
                        </div>

                        <button type="submit" class="btn btn-login">Login</button>
                    </form>

                    <div class="divider">Or Login With</div>

                    <button class="btn btn-google shadow-sm">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                        Sign in with Account Google
                    </button>

                    <div class="mt-4">
                        <a href="index.html" class="text-decoration-none text-muted" style="font-size: 0.9rem;">&#8592;
                            Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            let isValid = true;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailInput.value.trim() === '') {
                emailInput.classList.add('is-invalid');
                emailError.textContent = 'Email tidak boleh kosong.';
                emailError.style.display = 'block';
                isValid = false;
            } else if (!emailPattern.test(emailInput.value.trim())) {
                emailInput.classList.add('is-invalid');
                emailError.textContent = 'Format email tidak valid (contoh: user@email.com).';
                emailError.style.display = 'block';
                isValid = false;
            } else {
                emailInput.classList.remove('is-invalid');
                emailError.style.display = 'none';
            }

            if (passwordInput.value.trim() === '') {
                passwordInput.classList.add('is-invalid');
                passwordError.textContent = 'Password tidak boleh kosong.';
                passwordError.style.display = 'block';
                isValid = false;
            } else if (passwordInput.value.trim().length < 6) {

                passwordInput.classList.add('is-invalid');
                passwordError.textContent = 'Password minimal 6 karakter.';
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordInput.classList.remove('is-invalid');
                passwordError.style.display = 'none';
            }

            if (isValid) {
                alert('Login Berhasil! Mengalihkan ke halaman Home...');
                window.location.href = 'index.html';
            }
        });

        document.getElementById('emailInput').addEventListener('input', function () {
            this.classList.remove('is-invalid');
            document.getElementById('emailError').style.display = 'none';
        });

        document.getElementById('passwordInput').addEventListener('input', function () {
            this.classList.remove('is-invalid');
            document.getElementById('passwordError').style.display = 'none';
        });

        var tombolTema = document.getElementById('theme-toggle');
        var halaman = document.body;

        if (localStorage.getItem('darkMode') === 'enabled') {
            halaman.classList.add('dark-mode');
            tombolTema.innerHTML = 'Light Mode';
        }

        tombolTema.onclick = function () {
            halaman.classList.toggle('dark-mode');

            if (halaman.classList.contains('dark-mode')) {
                tombolTema.innerHTML = 'Light Mode';
                localStorage.setItem('darkMode', 'enabled');
            } else {
                tombolTema.innerHTML = 'Dark Mode';
                localStorage.setItem('darkMode', 'disabled');
            }
        };
    </script>
</body>

</html>
